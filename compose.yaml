services:
  video-worker:
    image: tamestorage-video:latest
    build:
      context: .
      dockerfile: Dockerfile.video
    container_name: tamestorage-video-worker
    restart: unless-stopped
    env_file:
    - /etc/tamestorage.env
    command:
    - python
    - video_worker.py
    volumes:
    - type: bind
      source: /srv/tamestorage/uploads/Admin/Movies
      target: /srv/tamestorage/uploads/Admin/Movies
      bind:
        create_host_path: false
    - type: bind
      source: /srv/tamestorage/.tamestorage_state
      target: /srv/tamestorage/.tamestorage_state
      bind:
        create_host_path: false
    user: 1000:1000
    read_only: true
    tmpfs:
    - /tmp:size=512m,mode=1777
    security_opt:
    - no-new-privileges:true
    healthcheck:
      disable: true
  web:
    image: tamestorage:latest
    build:
      context: .
    container_name: tamestorage
    networks:
    - default
    - vault-sync
    mem_limit: 2g
    memswap_limit: 2g
    mem_reservation: 512m
    restart: unless-stopped
    env_file:
    - /etc/tamestorage.env
    environment:
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
      PLAYLIST_RUNTIME_DIR: /srv/tamestorage/.tamestorage_state/playlist_runtime
      PLAYLIST_DELETE_CONFIRM_SECONDS: '300'
      PLAYLIST_SNAPSHOT_TIMEOUT_SECONDS: '900'
      NAVIDROME_DB_PATH: /srv/navidrome-data/navidrome.db
      GOODNOTES_STATS_URL: http://goodnotes-stats:8080
    ports:
    - 127.0.0.1:5000:5000
    volumes:
    - type: bind
      source: /home/tameszaza/.local/lib/goodnotes-links
      target: /opt/livesync
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /home/tameszaza/.config/goodnotes-links/livesync.json
      target: /run/obsidian-livesync.json
      read_only: true
      bind:
        create_host_path: false
    - /srv/docker/tamestorage/routes/__init__.py:/app/routes/__init__.py:ro
    - /srv/docker/tamestorage/app.py:/app/app.py:ro
    - /srv/docker/tamestorage/routes/chat_archive.py:/app/routes/chat_archive.py:ro
    - /srv/docker/tamestorage/lib/chat_archive.py:/app/lib/chat_archive.py:ro
    - /srv/docker/tamestorage/lib/chat_archive_export.py:/app/lib/chat_archive_export.py:ro
    - /srv/docker/tamestorage/lib/chat_archive_jobs.py:/app/lib/chat_archive_jobs.py:ro
    - /srv/docker/tamestorage/templates/chat_archive.html:/app/templates/chat_archive.html:ro
    - /srv/docker/tamestorage/templates/chat_archive_conversation.html:/app/templates/chat_archive_conversation.html:ro
    - /srv/docker/tamestorage/static/css/chat-archive.css:/app/static/css/chat-archive.css:ro
    - /srv/docker/tamestorage/static/js/chat-archive.js:/app/static/js/chat-archive.js:ro
    - /home/tameszaza/.config/cyborg-services/helper.json:/run/chat-archive-helper.json:ro
    - /srv/docker/tamestorage/templates/base.html:/app/templates/base.html:ro
    - /srv/docker/tamestorage/templates/admin_panel.html:/app/templates/admin_panel.html:ro
    - /srv/docker/tamestorage/lib/atomic_upload.py:/app/lib/atomic_upload.py:ro
    - /srv/docker/tamestorage/routes/files.py:/app/routes/files.py:ro
    - /srv/docker/tamestorage/templates/goodnotes_import.html:/app/templates/goodnotes_import.html:ro
    - /srv/docker/tamestorage/static/js/activity-console.js:/app/static/js/activity-console.js:ro
    - /srv/docker/tamestorage/static/css/activity-console.css:/app/static/css/activity-console.css:ro
    - /srv/docker/tamestorage/templates/activity_console.html:/app/templates/activity_console.html:ro
    - /srv/docker/tamestorage/routes/activity.py:/app/routes/activity.py:ro
    - /srv/docker/tamestorage/routes/goodnotes.py:/app/routes/goodnotes.py:ro
    - /srv/docker/tamestorage/lib/goodnotes_status.py:/app/lib/goodnotes_status.py:ro
    - /srv/docker/tamestorage/lib/goodnotes_download.py:/app/lib/goodnotes_download.py:ro
    - /srv/docker/tamestorage/templates/_goodnotes_warning.html:/app/templates/_goodnotes_warning.html:ro
    - /srv/docker/tamestorage/static/service-worker.js:/app/static/service-worker.js:ro
    - /srv/docker/tamestorage/routes/obsidian_mobile.py:/app/routes/obsidian_mobile.py:ro
    - /srv/docker/tamestorage/lib/obsidian_mobile_runner.py:/app/lib/obsidian_mobile_runner.py:ro
    - /srv/docker/tamestorage/lib/assistant_diary.py:/app/lib/assistant_diary.py:ro
    - /srv/docker/tamestorage/lib/ai_client.py:/app/lib/ai_client.py:ro
    - /srv/docker/tamestorage/lib/assistant_agenda.py:/app/lib/assistant_agenda.py:ro
    - /srv/docker/tamestorage/lib/workspace_store.py:/app/lib/workspace_store.py:ro
    - /srv/docker/tamestorage/lib/workspace_provider.py:/app/lib/workspace_provider.py:ro
    - /srv/docker/tamestorage/lib/workspace_tools.py:/app/lib/workspace_tools.py:ro
    - /srv/docker/tamestorage/lib/workspace_protocol.py:/app/lib/workspace_protocol.py:ro
    - /srv/docker/tamestorage/lib/workspace_documents.py:/app/lib/workspace_documents.py:ro
    - /srv/docker/tamestorage/lib/workspace_agent.py:/app/lib/workspace_agent.py:ro
    - /srv/docker/tamestorage/routes/workspace_agent.py:/app/routes/workspace_agent.py:ro
    - /srv/docker/tamestorage/templates/_services.html:/app/templates/_services.html:ro
    - /srv/docker/tamestorage/static/js/services.js:/app/static/js/services.js:ro
    - /srv/docker/tamestorage/static/js/chat.js:/app/static/js/chat.js:ro
    - /srv/docker/tamestorage/routes/ai.py:/app/routes/ai.py:ro
    - /srv/docker/tamestorage/lib/assistant_images.py:/app/lib/assistant_images.py:ro
    - /srv/docker/tamestorage/lib/assistant_calendar_drafts.py:/app/lib/assistant_calendar_drafts.py:ro
    - /srv/docker/tamestorage/templates/chat.html:/app/templates/chat.html:ro
    - /srv/docker/tamestorage/static/css/chat-page.css:/app/static/css/chat-page.css:ro
    - /srv/docker/tamestorage/templates/calendar_import_review.html:/app/templates/calendar_import_review.html:ro
    - /srv/docker/tamestorage/deploy/obsidian-diary.mjs:/app/deploy/obsidian-diary.mjs:ro
    - /srv/docker/tamestorage/static/css/services.css:/app/static/css/services.css:ro
    - type: bind
      source: /srv/tamestorage/uploads
      target: /srv/tamestorage/uploads
      bind:
        create_host_path: false
    - type: bind
      source: /srv/tamestorage/.tamestorage_state
      target: /srv/tamestorage/.tamestorage_state
      bind:
        create_host_path: false
    - type: bind
      source: /srv/music
      target: /srv/music
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /srv/system-disk-check
      target: /srv/system-disk-check
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /srv/tamestorage-backup
      target: /srv/tamestorage-backup
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /srv/docker/navidrome/data
      target: /srv/navidrome-data
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /run/tamestorage-control
      target: /run/tamestorage-control
      bind:
        create_host_path: false
    - /srv/docker/tamestorage/routes/goodnotes_stats.py:/app/routes/goodnotes_stats.py:ro
    - /srv/docker/tamestorage/templates/goodnotes_stats.html:/app/templates/goodnotes_stats.html:ro
    - /srv/docker/tamestorage/static/css/goodnotes-stats.css:/app/static/css/goodnotes-stats.css:ro
    - /srv/docker/tamestorage/static/js/goodnotes-stats.js:/app/static/js/goodnotes-stats.js:ro
    user: 1000:1000
    read_only: true
    tmpfs:
    - /tmp:size=256m,mode=1777
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD-SHELL
      - python -c 'from pathlib import Path; import urllib.request; Path("/srv/tamestorage/.tamestorage_state/users.json").read_bytes();
        urllib.request.urlopen("http://127.0.0.1:5000/", timeout=3)'
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
  playlist-worker:
    image: tamestorage:latest
    container_name: tamestorage-playlist-worker
    restart: unless-stopped
    env_file:
    - /etc/tamestorage.env
    environment:
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
      PLAYLIST_RUNTIME_DIR: /srv/tamestorage/.tamestorage_state/playlist_runtime
      PLAYLIST_DELETE_CONFIRM_SECONDS: '300'
      PLAYLIST_SNAPSHOT_TIMEOUT_SECONDS: '900'
    command:
    - python
    - playlist_worker.py
    volumes:
    - type: bind
      source: /srv/tamestorage/.tamestorage_state
      target: /srv/tamestorage/.tamestorage_state
      bind:
        create_host_path: false
    - type: bind
      source: /srv/music
      target: /srv/music
      bind:
        create_host_path: false
    - type: bind
      source: /srv/tamestorage/uploads/temp/Transcription
      target: /srv/tamestorage/uploads/temp/Transcription
      bind:
        create_host_path: false
    - type: bind
      source: /srv/tamestorage/uploads/Admin/Transcripts
      target: /srv/tamestorage/uploads/Admin/Transcripts
      read_only: true
      bind:
        create_host_path: false
    user: 1000:1000
    read_only: true
    tmpfs:
    - /tmp:size=256m,mode=1777
    security_opt:
    - no-new-privileges:true
    healthcheck:
      disable: true
  radicale:
    image: ghcr.io/kozea/radicale:stable
    container_name: tamestorage-calendar
    restart: unless-stopped
    ports:
    - 127.0.0.1:5232:5232
    volumes:
    - type: bind
      source: /srv/tamestorage/.tamestorage_state/radicale/config
      target: /etc/radicale
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /srv/tamestorage/.tamestorage_state/radicale/data
      target: /var/lib/radicale
      bind:
        create_host_path: false
    security_opt:
    - no-new-privileges:true
  calendar-worker:
    image: tamestorage:latest
    container_name: tamestorage-calendar-worker
    restart: unless-stopped
    env_file:
    - /etc/tamestorage.env
    environment:
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
      MPLCONFIGDIR: /tmp/matplotlib
    command:
    - python
    - calendar_worker.py
    depends_on:
    - radicale
    volumes:
    - type: bind
      source: /srv/tamestorage/.tamestorage_state
      target: /srv/tamestorage/.tamestorage_state
      bind:
        create_host_path: false
    user: 1000:1000
    read_only: true
    tmpfs:
    - /tmp:size=64m,mode=1777
    security_opt:
    - no-new-privileges:true
    healthcheck:
      disable: true
  goodnotes-stats:
    image: tamestorage-goodnotes-stats:1
    build:
      context: ./services/goodnotes-stats
    container_name: tamestorage-goodnotes-stats
    restart: unless-stopped
    env_file:
    - /etc/tamestorage-goodnotes-stats.env
    cpus: 0.25
    cpu_shares: 128
    mem_limit: 192m
    memswap_limit: 192m
    pids_limit: 32
    user: 1000:1000
    read_only: true
    tmpfs:
    - /tmp:size=16m,mode=1777
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    volumes:
    - type: bind
      source: /srv/tamestorage/uploads/Goodnotes
      target: /library
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /srv/tamestorage/.tamestorage_state/goodnotes-stats
      target: /state
      bind:
        create_host_path: false
    - type: bind
      source: /srv/tamestorage/.tamestorage_state
      target: /critical
      read_only: true
      bind:
        create_host_path: false
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=2)
      interval: 60s
      timeout: 3s
      retries: 3
networks:
  vault-sync:
    external: true
    name: obsidian-livesync_default
