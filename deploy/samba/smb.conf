[global]
   server role = standalone server
   workgroup = WORKGROUP
   netbios name = SERVER
   security = user
   map to guest = never
   interfaces = 127.0.0.1 192.168.0.2
   bind interfaces only = yes
   hosts allow = 127.0.0.1 192.168.0.0/24
   smb ports = 445
   disable netbios = yes
   server min protocol = SMB2_10
   server signing = default
   load printers = no
   printing = bsd
   printcap name = /dev/null
   fruit:aapl = yes
   fruit:nfs_aces = yes

[Storage]
   comment = Tamestorage primary USB disk
   path = /srv/tamestorage/uploads
   browseable = yes
   read only = no
   valid users = tameszaza
   force user = tameszaza
   force group = tameszaza
   create mask = 0770
   force create mode = 0660
   directory mask = 0770
   force directory mode = 0770
   veto files = /.tamestorage_system/
   delete veto files = no
   # Apple Files/iOS expects SMB extended attributes when determining whether
   # a share is writable. Keep these on the share so normal SMB clients remain
   # compatible while iOS can create and edit files.
   vfs objects = catia fruit streams_xattr
   fruit:metadata = stream
   fruit:resource = stream

# Tamestorage maintenance share
include = /etc/samba/tamestorage-maintenance.conf
