# Authenticated maintenance share. Uses ordinary Unix account permissions.
[Server-root]
   comment = Server maintenance
   path = /
   browseable = yes
   read only = no
   valid users = tameszaza
   guest ok = no
   follow symlinks = yes
   wide links = no
   create mask = 0664
   directory mask = 0775
   vfs objects = catia fruit streams_xattr
   fruit:metadata = stream
   fruit:resource = stream
   veto files = /.DS_Store/._*/
   delete veto files = no
