services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    user: "1000:1000"
    restart: unless-stopped
    environment:
      ND_LYRICSPRIORITY: ".ttml,.yaml,.yml,.elrc,.lrc,.srt,.txt,embedded"
      ND_DEVARTWORKMAXREQUESTS: "4"
      ND_DEVARTWORKTHROTTLEBACKLOGLIMIT: "1024"
      ND_DEVARTWORKTHROTTLEBACKLOGTIMEOUT: "2m"
      ND_DEVARTWORKTHROTTLEBUFFERED: "true"
      ND_IMAGECACHESIZE: "500MB"
      ND_ENABLEARTWORKPRECACHE: "true"
    ports:
      - "4533:4533"
    volumes:
      - /srv/docker/navidrome/data:/data
      - /srv/music:/music:ro

