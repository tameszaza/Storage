{% extends "base.html" %}
{% block title %}Not found · Tamestorage{% endblock %}
{% block content %}
<section class="empty-state glass-card not-found">
    <i class="fa-solid fa-triangle-exclamation"></i>
    <h1>Page not found</h1>
    <p class="muted">The page or file you requested does not exist, or you do not have access to it.</p>
    <div class="button-row center">
        <a class="btn btn-primary" href="{{ url_for('index') if session.get('logged_in') else url_for('login') }}">Go home</a>
    </div>
</section>
{% endblock %}
