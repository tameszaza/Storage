<article class="admin-card admin-full-span services-panel" id="servicesPanel" data-csrf="{{ services_csrf }}">
  <div class="section-heading services-heading"><h2>Services <span id="serviceCount" class="services-count"></span></h2><div class="services-toolbar"><a class="btn btn-outline-secondary" href="https://server.tailb7f57c.ts.net:3001/status/services" target="_blank" rel="noopener"><i class="fa-solid fa-heart-pulse" aria-hidden="true"></i> Uptime Kuma <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i></a><a class="btn btn-outline-secondary" href="https://server.tailb7f57c.ts.net:3001/dashboard" target="_blank" rel="noopener" aria-label="Configure uptime" title="Configure uptime"><i class="fa-solid fa-gear" aria-hidden="true"></i></a><button type="button" class="btn btn-outline-secondary" id="servicesRefresh" aria-label="Refresh services" title="Refresh"><i class="fa-solid fa-rotate" aria-hidden="true"></i></button></div></div>
  <div class="services-filters"><input id="serviceSearch" class="form-control" type="search" placeholder="Find a service…" aria-label="Find a service"><select id="serviceHost" class="form-select" aria-label="Service host"><option value="all">All hosts</option><option value="Server">Server</option><option value="Cyborg">Cyborg</option></select><select id="serviceFilter" class="form-select" aria-label="Filter services"><option value="all">All services</option><option value="running">Running</option><option value="stopped">Stopped</option><option value="attention">Needs attention</option></select></div>
  <div id="servicesMessage" class="services-message" role="status" aria-live="polite"></div>
  <div id="serviceList" class="service-list" aria-live="polite"><p class="muted">Loading services…</p></div>
  <dialog id="serviceDialog" aria-labelledby="serviceDialogTitle"><header><h2 id="serviceDialogTitle"></h2><button type="button" class="btn btn-outline-secondary" id="serviceDialogClose" aria-label="Close">✕</button></header><div id="serviceDialogBody"></div><footer id="serviceDialogFooter"></footer></dialog>
</article>
