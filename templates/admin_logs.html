{% extends "base.html" %}
{% block title %}Server logs · Tamestorage{% endblock %}
{% block content %}
<section class="log-page glass-card">
    <div class="section-heading">
        <div><p class="eyebrow">Admin logs</p><h1>Server logs</h1></div>
        <div class="button-row">
            <form action="{{ url_for('clear_logs') }}" method="POST" data-confirm="Clear all server logs?"><button class="btn btn-outline-danger" type="submit">Clear logs</button></form>
            <a class="btn btn-outline-primary" href="{{ url_for('admin') }}">Back to admin</a>
        </div>
    </div>
    <pre class="log-box">{{ log_contents }}</pre>
</section>
{% endblock %}
