{% extends "base.html" %}
{% block title %}Duplicate files · Tamestorage{% endblock %}
{% block link %}<link href="{{ url_for('static', filename='css/duplicates.css') }}?v=20260924c" rel="stylesheet">{% endblock %}
{% block content %}
<section class="duplicates-page" data-status-url="{{ url_for('duplicates_status') }}" data-scan-url="{{ url_for('duplicates_scan') }}">
    <header class="duplicates-heading">
        <div><h1>Duplicate files</h1><p>Find exact copies by content.</p></div>
        <button id="duplicateScanButton" class="btn btn-outline-secondary" type="button"><i class="fa-solid fa-rotate" aria-hidden="true"></i> Scan again</button>
    </header>
    <div id="duplicateStatus" class="duplicate-status" role="status" aria-live="polite">Checking the last scan…</div>
    <div id="duplicateSummary" class="duplicate-summary" hidden></div>
    <div id="duplicateGroups" class="duplicate-groups"></div>
    <nav id="duplicatePages" class="duplicate-pages" aria-label="Duplicate result pages" hidden></nav>
    <noscript><p>Enable JavaScript to view scan results.</p></noscript>
</section>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/duplicates.js') }}?v=20260924b" defer></script>{% endblock %}
