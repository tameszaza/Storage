{% extends "base.html" %}
{% block title %}Edit {{ filename }} · Tamestorage{% endblock %}
{% block content %}
<section class="editor-card glass-card">
    <div class="section-heading">
        <div>
            <p class="eyebrow">Text editor</p>
            <h1>{{ filename }}</h1>
            <p class="muted">/{{ path }}</p>
        </div>
        <a class="btn btn-outline-primary" href="{{ url_for('index', path=path) }}">Back</a>
    </div>
    <form action="{{ url_for('save_file', path=path, filename=filename) }}" method="POST">
        <textarea class="code-editor" name="file_content" spellcheck="false">{{ content }}</textarea>
        <div class="button-row mt-3">
            <button class="btn btn-primary" type="submit">Save file</button>
            <a class="btn btn-outline-secondary" href="{{ url_for('index', path=path) }}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
