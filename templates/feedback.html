{% extends "base.html" %}
{% block title %}Feedback · Tamestorage{% endblock %}
{% block content %}
<section class="auth-layout narrow">
    <form method="POST" class="auth-card glass-card">
        <p class="eyebrow">Feedback</p>
        <h2>Tell us what to improve</h2>
        {% if feedback_submitted %}<div class="alert alert-success">Thanks. Your feedback has been submitted.</div>{% endif %}
        <label class="form-label" for="feedback_type">Type</label>
        <select id="feedback_type" class="form-select" name="feedback_type" required>
            <option value="Bug">Bug</option>
            <option value="Feature request">Feature request</option>
            <option value="Design">Design</option>
            <option value="General">General</option>
        </select>
        <label class="form-label mt-3" for="rating">Rating</label>
        <select id="rating" class="form-select" name="rating">
            <option value="5">5 · Excellent</option>
            <option value="4">4 · Good</option>
            <option value="3">3 · Okay</option>
            <option value="2">2 · Needs work</option>
            <option value="1">1 · Bad</option>
        </select>
        <label class="form-label mt-3" for="message">Message</label>
        <textarea id="message" class="form-control" name="message" rows="6" placeholder="Write your feedback here" required></textarea>
        <button class="btn btn-primary btn-lg w-100 mt-4" type="submit">Submit feedback</button>
        <a class="soft-link d-inline-block mt-3" href="{{ url_for('index') }}">Back to files</a>
    </form>
</section>
{% endblock %}
