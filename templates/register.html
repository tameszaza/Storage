{% extends "base.html" %}
{% block title %}Register · Tamestorage{% endblock %}
{% block content %}
<section class="auth-layout narrow">
    <form method="POST" class="auth-card glass-card">
        <p class="eyebrow">New workspace</p>
        <h2>Create account</h2>
        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
        <label class="form-label" for="username">Username</label>
        <input class="form-control form-control-lg" id="username" type="text" name="username" autocomplete="username" required>
        <label class="form-label mt-3" for="password">Password</label>
        <input class="form-control form-control-lg" id="password" type="password" name="password" autocomplete="new-password" required>
        <button class="btn btn-primary btn-lg w-100 mt-4" type="submit">Create account</button>
        <p class="auth-alt">Already registered? <a href="{{ url_for('login') }}">Login</a></p>
    </form>
</section>
{% endblock %}
